<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Examination</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <section id="loginSection" class="card">

        <h1>Student Examination</h1>

        <p class="subtitle">
            Enter your details to start the examination
        </p>

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <label for="registerNumber">Register Number</label>
        <input
            type="text"
            id="registerNumber"
            placeholder="Enter register number"
            autocomplete="off"
        >

        <button id="startButton" type="button">
            Start Examination
        </button>

        <p id="loginError" class="error"></p>

    </section>


    <!-- EXAM -->
    <section id="examSection" class="hidden">

        <div class="exam-header">

            <div>
                <h2>MCQ Examination</h2>
                <p id="studentDisplay"></p>
            </div>

            <div class="timer">
                Time:
                <span id="timer">60:00</span>
            </div>

        </div>


        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>


        <div class="card">

            <div class="question-number">
                Question
                <span id="questionNumber">1</span>
                /
                <span id="totalQuestions">60</span>
            </div>

            <h2 id="questionText"></h2>

            <div id="options"></div>


            <div class="navigation">

                <button
                    id="previousButton"
                    type="button"
                >
                    Previous
                </button>

                <button
                    id="nextButton"
                    type="button"
                >
                    Next
                </button>

                <button
                    id="submitButton"
                    class="submit"
                    type="button"
                >
                    Submit Exam
                </button>

            </div>

        </div>


        <div
            class="question-grid"
            id="questionGrid"
        ></div>

    </section>


    <!-- RESULT -->
    <section id="resultSection" class="card hidden">

        <h1>Examination Completed</h1>

        <p>Student:</p>

        <h2 id="resultStudent"></h2>

        <div class="result-box">

            <div>
                <span>Score</span>
                <strong id="resultScore">0</strong>
            </div>

            <div>
                <span>Total</span>
                <strong id="resultTotal">60</strong>
            </div>

            <div>
                <span>Percentage</span>
                <strong id="resultPercentage">0%</strong>
            </div>

        </div>

        <p id="resultMessage"></p>

        <button
            type="button"
            id="restartButton"
        >
            Back to Login
        </button>

    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
